<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Pian piano · Italiano desde cero</title>
  <meta name="description" content="Curso de italiano desde cero para hispanohablantes. Nivel A1.">
  <!-- Il contenuto lo aggiorna js/store.js quando il tema cambia. -->
  <meta name="theme-color" id="theme-color" content="#F7F5F0">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Pian piano">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Il tema scelto va applicato PRIMA del primo paint, altrimenti chi ha
       scelto lo scuro vede un lampo bianco a ogni caricamento. Deve stare
       qui, inline e sincrono: un modulo ES arriverebbe troppo tardi.
       Legge la stessa chiave di js/store.js; se cambia lì, cambia anche qui. -->
  <script>
    (function () {
      var scelta = 'auto';
      try {
        var raw = localStorage.getItem('pianpiano.v1');
        if (raw) {
          var t = JSON.parse(raw).theme;
          if (t === 'light' || t === 'dark') scelta = t;
        }
      } catch (e) {
        /* modalità privata o dati illeggibili: resta 'auto' */
      }
      /* «auto» viene risolto qui in un valore concreto, così il CSS ha
         bisogno dei soli due blocchi di variabili e nessun colore va
         scritto due volte. Il cambio di tema di sistema, a scelta «auto»,
         viene riseguito a runtime da js/store.js. */
      if (scelta === 'auto') {
        scelta = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }
      if (scelta === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <a class="brand" href="#/">
      <span class="brand-title">Pian piano</span>
      <span class="brand-sub">italiano desde cero</span>
    </a>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="#/" data-nav="home">Inicio</a>
      <a href="#/repaso" data-nav="review">Repaso <span class="badge" id="nav-due" hidden>0</span></a>
    </nav>
  </header>

  <main id="main" class="app" tabindex="-1"></main>

  <footer class="site-footer">
    <p>Pian piano · italiano desde cero · nivel A1</p>
    <p class="fine-print">Tus progresos se guardan solo en este navegador: no se sincronizan entre dispositivos.</p>
  </footer>

  <noscript>
    <p class="notice">Esta web necesita JavaScript para funcionar. Actívalo y vuelve a cargar la página.</p>
  </noscript>

  <!-- Avviso per chi apre il file direttamente da disco: i moduli ES e fetch()
       richiedono il protocollo http, quindi serve un piccolo server locale. -->
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('main').innerHTML =
          '<div class="card notice">' +
          '<h2>Hace falta un servidor local</h2>' +
          '<p>Has abierto el archivo directamente desde el disco. Los navegadores bloquean la carga de módulos y de datos con el protocolo <code>file://</code>.</p>' +
          '<p>Abre una terminal en esta carpeta y ejecuta uno de estos comandos:</p>' +
          '<pre><code>python -m http.server 8000</code></pre>' +
          '<pre><code>npx serve .</code></pre>' +
          '<p>Después entra en <code>http://localhost:8000/</code>. Publicado en GitHub Pages no hace falta nada de esto.</p>' +
          '</div>';
      });
    }
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
